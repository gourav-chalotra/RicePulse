<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicePulse - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #15803d;
            --primary-dark: #0f5128;
            --primary-light: #22c55e;
            --surface: #ffffff;
            --bg: #f8faf9;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 45px -10px rgba(21, 128, 61, 0.1), 0 8px 20px -4px rgba(15, 23, 42, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 15% 15%, rgba(220, 247, 227, 0.5) 0%, transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(200, 240, 215, 0.4) 0%, transparent 50%),
                        var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        /* NAVBAR */
        header {
            height: 76px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid #edf2ee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            width: 90%;
            max-width: 1200px;
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0f351b;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #e8f7ee, #c8eed6);
            border: 1px solid #b2e4c3;
            border-radius: 12px;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
        }

        .logo span:last-child span {
            color: var(--primary);
        }

        .back-home {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            background: #f1f6f2;
            border: 1px solid #e2ece4;
        }

        .back-home:hover {
            color: var(--primary);
            background: #e6f4ea;
            border-color: #c5e6ce;
        }

        /* REGISTER CONTAINER */
        .register-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            padding: 42px 38px;
            border-radius: var(--radius-lg);
            border: 1px solid #e1e9e3;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eaf7ed, #dcf2e2);
            border: 1px solid #c8ebd1;
            border-radius: 18px;
            font-size: 28px;
            box-shadow: 0 4px 14px rgba(21, 128, 61, 0.12);
        }

        .container .logo-title {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: #0c1e13;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 13.5px;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #dbe3dc;
            border-radius: 10px;
            font-size: 14px;
            color: #0f172a;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #15803d, #166534);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(21, 128, 61, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: linear-gradient(135deg, #166534, #14532d);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(21, 128, 61, 0.35);
        }

        button:disabled {
            background: #94a3b8;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
        }

        .login {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .login a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .login a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            header {
                height: 66px;
            }

            .container {
                padding: 30px 22px;
            }

            .container .logo-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <span class="logo-icon">🌾</span>
                <span>
                    Rice<span>Pulse</span>
                </span>
            </a>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </header>

    <main class="register-container">
        <div class="container">

            <div class="register-header">
                <div class="register-icon">🌱</div>
                <div class="logo logo-title" style="justify-content: center;">RicePulse</div>
                <p class="subtitle">Create your account</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >
                </div>

                <button type="submit" id="registerButton">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <div class="login">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>
    </main>

    <script>
        // ==========================================
        // API GATEWAY ENDPOINT
        // ==========================================
        const API_URL =
            "https://76top6kvwh.execute-api.us-east-1.amazonaws.com/register";

        // ==========================================
        // REGISTRATION
        // ==========================================
        document
            .getElementById("registerForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const message =
                    document.getElementById("message");

                const button =
                    document.getElementById("registerButton");

                // Get values
                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                // ==========================================
                // CHECK PASSWORD
                // ==========================================
                if (password !== confirmPassword) {
                    message.innerText =
                        "Passwords do not match.";
                    message.style.color = "#dc2626";
                    message.style.background = "#fef2f2";
                    return;
                }

                // ==========================================
                // DATA SENT TO API GATEWAY
                // ==========================================
                const userData = {
                    name: name,
                    email: email,
                    phone: phone,
                    password: password
                };

                console.log("Sending:", userData);

                try {
                    button.disabled = true;
                    button.innerText =
                        "Creating Account...";

                    // ==========================================
                    // POST REQUEST
                    // ==========================================
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(userData)
                    });

                    // Get Lambda response
                    const result =
                        await response.json();

                    console.log(
                        "Server response:",
                        result
                    );

                    // ==========================================
                    // SUCCESS
                    // ==========================================
                    if (response.ok) {
                        message.innerText =
                            result.message ||
                            "Registration successful!";
                        message.style.color = "#15803d";
                        message.style.background = "#f0fdf4";

                        document
                            .getElementById("registerForm")
                            .reset();
                    }
                    // ==========================================
                    // ERROR
                    // ==========================================
                    else {
                        message.innerText =
                            result.message ||
                            "Registration failed.";
                        message.style.color = "#dc2626";
                        message.style.background = "#fef2f2";
                    }
                }
                catch (error) {
                    console.error(error);
                    message.innerText =
                        "Unable to connect to server.";
                    message.style.color = "#dc2626";
                    message.style.background = "#fef2f2";
                }
                finally {
                    button.disabled = false;
                    button.innerText =
                        "Create Account";
                }
            });
    </script>

</body>
</html>
